[project]
name = "data-grounding-platform"
version = "1.0.0"
description = "A grounding platform that gets AI agents to quote the right statistic, from the right revision, with the right citation, at a known cost — and the product layer that decides what to build next from evidence."
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.3",
  "dbt-duckdb>=1.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=2.3",
  "pydantic>=2.8",
  "pyyaml>=6",
  "numpy>=2",
  "scipy>=1.14",
  "typer>=0.12",
  "jsonschema>=4.23",
]

[project.scripts]
dgp = "dgp.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: builds the whole world once (~30 s)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/dgp/cli.py" = ["B008"]
"src/dgp/product/docs.py" = ["E501"]   # document templates
